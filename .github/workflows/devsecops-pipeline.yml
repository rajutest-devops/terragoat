# DevSecOps Security Pipeline
# Purpose: Shift-left security scanning for Terraform IaC
# Triggers: Every push and every pull request to demo-main and feature branches
# Stages: lint → iac-scan → secret-scan

### Key security practices applied here:
#  - Pinned action versions (not @main or @master which can change silently)
#  - Least-privilege GITHUB_TOKEN permissions declared explicitly
#  - No self-hosted runners (avoids runner compromise via malicious PRs)
#  - Artifacts uploaded for audit trail (findings are stored, not just printed)
#  - All scan tools run independently so one failure doesn't hide others
#  - allow_failure distinction: lint blocks, scan warns, secrets blocks

name: DevSecOps Pipeline

on:
  push:
    branches: [demo-main, aws-fix-pipeline-demo, master, main, 'feature/*']
  pull_request:
    branches: [demo-main, master, main, 'feature/*']

# Declare minimum required permissions for the GITHUB_TOKEN
# Default is write-all which violates least-privilege
permissions:
  contents: read        # Read repo files
  security-events: write # Upload SARIF results to GitHub Security tab
  pull-requests: write  # Post scan summary as PR comment

jobs:
  # ─────────────────────────────────────────────
  # STAGE 1: LINT
  # Check Terraform syntax and formatting before scanning
  # Fast - catches typos before wasting scan time
  # ─────────────────────────────────────────────
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # AWS-only assessment scope in this demo branch
        cloud: [aws]
    steps:
      - name: Checkout repository
        # Pinned to v4.2.2 SHA - not using @v4 tag which is mutable
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Setup Terraform
        # Pinned to correct SHA corresponding to latest v3 release
        uses: hashicorp/setup-terraform@f1fd52da0e290f67c3f30997f6424e4d6d375373 
      
      - name: Terraform Format Check (${{ matrix.cloud }})
        working-directory: terraform/${{ matrix.cloud }}
        # -check flag makes this exit non-zero if formatting is wrong
        # -recursive checks all subdirectories
        run: terraform fmt -check -recursive .
        continue-on-error: true  # Warn but don't block on formatting
      
      - name: Terraform Validate (${{ matrix.cloud }})
        working-directory: terraform/${{ matrix.cloud }}
        run: |
          terraform init -backend=false
          terraform validate
        # -backend=false skips state backend init (we don't have credentials here)
        # This still validates resource types, argument names, and value types

  # ─────────────────────────────────────────────
  # STAGE 2: IAC SECURITY SCANNING
  # Run Checkov + TFSec on all Terraform directories
  # Both tools run even if one fails (fail-fast: false)
  # ─────────────────────────────────────────────
  checkov-scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: terraform-lint  # Only run after lint passes
    if: always()
    # Not blocking on lint failure so scans still run on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Run Checkov - AWS
        uses: bridgecrewio/checkov-action@d2fded85b7a55e3c51e2e3e0b5fe55e6f7a7ed1
        # Pinned to a specific commit SHA - not @master
        with:
          directory: terraform/aws
          output_format: cli,sarif
          output_file_path: console,checkov-aws.sarif
          soft_fail: true  # Don't block pipeline - upload findings as annotations
      
      # Upload SARIF to GitHub Security tab - findings appear as Code Scanning alerts
      - name: Upload Checkov AWS results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        # Pinned to codeql-action v3.28.18
        with:
          sarif_file: checkov-aws.sarif
          category: checkov-aws
        if: always()

  tfsec-scan:
    name: TFSec IaC Scan
    runs-on: ubuntu-latest
    needs: terraform-lint
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Run TFSec
        # TFSec gives CRITICAL/HIGH/MEDIUM/LOW severity - better signal than Checkov alone
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6
        # Pinned to v1.0.3
        with:
          working_directory: terraform/aws
          format: sarif
          sarif_file: tfsec.sarif
          soft_fail: true  # Don't fail build - surface as annotations
      
      - name: Upload TFSec results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          sarif_file: tfsec.sarif
          category: tfsec
        if: always()

  # ─────────────────────────────────────────────
  # STAGE 3: SECRET SCANNING
  # Scan both current code AND git history for leaked credentials
  # This job BLOCKS the pipeline if secrets are found
  # A committed secret is a breach - no soft_fail here
  # ─────────────────────────────────────────────
  secret-scan:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest
    # Run in parallel with IaC scans - secrets are independent of lint
    steps:
      - name: Checkout repository
        # fetch-depth: 0 fetches FULL git history
        # Without this, GitLeaks only scans current files, not history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      
      - name: Run GitLeaks - Scan full git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        # Pinned to v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Uncomment above if using GitLeaks Pro (required for org-level scanning)
        with:
          args: --verbose
        # Note: This will FAIL if secrets are found in git history
        # That is intentional - a leaked secret requires immediate rotation,
        # not just removing it from the latest commit

  # ─────────────────────────────────────────────
  # STAGE 4: SUMMARY REPORT
  # Only runs on PRs - posts a comment with scan summary
  # ─────────────────────────────────────────────
  pr-summary:
    name: Post PR Summary
    runs-on: ubuntu-latest
    needs: [checkov-scan, tfsec-scan, secret-scan]
    if: github.event_name == 'pull_request' && always()
    # always() ensures this runs even if previous jobs had failures
    steps:
      - name: Post scan summary comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        # Pinned to v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jobResults = {
              checkov: '${{ needs.checkov-scan.result }}',
              tfsec: '${{ needs.tfsec-scan.result }}',
              secrets: '${{ needs.secret-scan.result }}'
            };
            const statusEmoji = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '⚠️';
            const body = `## DevSecOps Pipeline Results
            | Scan | Status | Details |
            |------|--------|---------|
            | Checkov IaC Scan | ${statusEmoji(jobResults.checkov)} ${jobResults.checkov} | Check Security tab for findings |
            | TFSec IaC Scan | ${statusEmoji(jobResults.tfsec)} ${jobResults.tfsec} | Check Security tab for findings |
            | GitLeaks Secret Scan | ${statusEmoji(jobResults.secrets)} ${jobResults.secrets} | Failed = secrets found in history |
            > Scan findings are uploaded to the **Security** tab → **Code Scanning** of this repository.
            > All SARIF results are available there with file/line references.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
name: Terraform Destroy (Manual)

# Manual-only trigger — never runs automatically
# Requires explicit approval before destroy executes
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm you want to tear down all resources"
        required: true
        type: string
      environment:
        description: "Environment to destroy"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - staging
          - production

permissions:
  contents: read

# Prevents concurrent destroy runs
concurrency:
  group: terraform-destroy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  TF_STATE_BUCKET: my-terragoat-tfstate-2026-nttdata
  TF_STATE_KEY: terragoat/aws/terraform.tfstate
  TF_STATE_REGION: us-east-1   # S3 state bucket lives in us-east-1
  TF_DEPLOY_REGION: us-west-2  # AWS resources deployed in us-west-2 (matches AWS_REGION secret)

jobs:
  # ─────────────────────────────────────────────
  # SAFETY CHECK — validates the DESTROY confirmation word
  # Prevents accidental triggers with wrong input
  # ─────────────────────────────────────────────
  safety-check:
    name: Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation input
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "DESTROY" ]]; then
            echo "::error::Confirmation failed. You must type DESTROY (all caps) to proceed."
            exit 1
          fi
          echo "Confirmation accepted. Proceeding to approval gate."

  # ─────────────────────────────────────────────
  # APPROVAL GATE — pauses here until a reviewer approves
  # Configure approvers: GitHub → Settings → Environments → cd-destroy-gate
  # Add yourself as required reviewer there
  # ─────────────────────────────────────────────
  destroy-approval:
    name: Approval Gate (cd-destroy-gate)
    runs-on: ubuntu-latest
    needs: safety-check
    environment:
      name: cd-destroy-gate
    steps:
      - name: Approval granted
        run: |
          echo "Destroy approved for environment: ${{ github.event.inputs.environment }}"
          echo "Proceeding with Terraform destroy against remote state."

  # ─────────────────────────────────────────────
  # DESTROY — runs only after approval gate is cleared
  # Reads state from S3, destroys all tracked resources
  # ─────────────────────────────────────────────
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: destroy-approval
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd

      - name: Validate AWS credentials
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" || -z "${AWS_DEFAULT_REGION:-}" ]]; then
            echo "::error::Missing AWS credentials. Set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_REGION in repository secrets."
            exit 1
          fi

      - name: Terraform Init (S3 remote backend)
        run: |
          set -euo pipefail
          terraform -chdir=terraform/aws init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform Destroy
        run: |
          set -euo pipefail
          terraform -chdir=terraform/aws destroy \
            -var="region=us-west-2" \
            -auto-approve

      - name: Destroy summary
        run: |
          echo "All Terraform-managed resources have been destroyed."
          echo "State file (now empty) is at: s3://${TF_STATE_BUCKET}/${TF_STATE_KEY}"
          echo "No further AWS charges will accrue from this deployment."
